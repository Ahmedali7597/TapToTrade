name: Feature request
description: Suggest an idea that would make trading easier.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe what's hard or missing today.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: How you picture it working.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Other options you've considered
