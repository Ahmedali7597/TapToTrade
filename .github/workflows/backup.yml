# Requirement 5.5.1: daily automated database backup.
# Dumps the production database, encrypts it (AES-256, passphrase in secrets) and keeps it as a
# private workflow artifact for 14 days. GitHub emails the repo owner if a scheduled run fails.
# pg_dump must be at least the server's version, so the image tag follows the production database (Neon, Postgres 18).
# Secrets: BACKUP_DATABASE_URL (read-only role recommended) and BACKUP_PASSPHRASE, or a single
# BACKUP_CODES secret holding both as KEY=value lines (the separate secrets win if both exist).
# Restore: see README "Backups and restore".
name: Daily database backup
on:
  schedule:
    - cron: "30 7 * * *" # 07:30 UTC ≈ 03:30 in Ontario
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Dump and encrypt
        env:
          DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
          BACKUP_CODES: ${{ secrets.BACKUP_CODES }}
        run: |
          set -euo pipefail
          # Fall back to KEY=value lines in BACKUP_CODES (Windows line endings tolerated). Values are never echoed.
          codes=$(printf '%s\n' "${BACKUP_CODES:-}" | tr -d '\r')
          pick() { printf '%s\n' "$codes" | sed -n "s/^[[:space:]]*$1[[:space:]]*=[[:space:]]*//p" | head -n 1; }
          DATABASE_URL=${DATABASE_URL:-$(pick BACKUP_DATABASE_URL)}
          BACKUP_PASSPHRASE=${BACKUP_PASSPHRASE:-$(pick BACKUP_PASSPHRASE)}
          if [ -z "$DATABASE_URL" ] || [ -z "$BACKUP_PASSPHRASE" ]; then
            echo "::error::Set the BACKUP_DATABASE_URL and BACKUP_PASSPHRASE repository secrets (Settings > Secrets and variables > Actions)."
            exit 1
          fi
          # sslmode=verify-full needs a trust store: use the system roots (mounted into the container below).
          case "$DATABASE_URL" in
            *sslrootcert=*) ;;
            *\?*) DATABASE_URL="$DATABASE_URL&sslrootcert=system" ;;
            *) DATABASE_URL="$DATABASE_URL?sslrootcert=system" ;;
          esac
          echo "::add-mask::$DATABASE_URL"
          echo "::add-mask::$BACKUP_PASSPHRASE"
          export DATABASE_URL BACKUP_PASSPHRASE
          file="taptotrade-$(date -u +%Y%m%dT%H%MZ).dump.gpg"
          docker run --rm -e DATABASE_URL -v /etc/ssl/certs:/etc/ssl/certs:ro postgres:18 sh -c 'pg_dump --format=custom --no-owner "$DATABASE_URL"' \
            | gpg --batch --yes --symmetric --cipher-algo AES256 --passphrase "$BACKUP_PASSPHRASE" -o "$file"
          test "$(stat -c %s "$file")" -gt 1024 # fail loudly on an empty dump
          echo "BACKUP_FILE=$file" >> "$GITHUB_ENV"
      # Only the encrypted file is uploaded; the plain dump never touches disk.
      - uses: actions/upload-artifact@v7
        with:
          name: db-backup
          path: ${{ env.BACKUP_FILE }}
          retention-days: 14
