<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Tap to Trade animated logo preview using curved arrow by dh park.">
  <title>Tap to Trade logo preview</title>
  <link rel="stylesheet" href="taptotrade-logo.css">
  <style>
    body { margin: 0; min-height: 100vh; display: grid; grid-template-rows: 1fr auto; background: #f8f7f2; color: #153c35; font: 1rem/1.6 system-ui, sans-serif; }
    main { display: grid; place-content: center; gap: 32px; padding: 48px 24px; text-align: center; }
    .controls { display: flex; flex-wrap: wrap; justify-content: center; gap: 16px; align-items: center; }
    button { min-height: 44px; padding: 10px 20px; font: inherit; font-weight: 650; border: 1px solid #b2c1b9; border-radius: 100px; color: #153c35; background: transparent; cursor: pointer; }
    button:disabled { opacity: .6; cursor: default; }
    label { display: flex; align-items: center; gap: 8px; min-height: 44px; color: #52625d; }
    input { width: 18px; height: 18px; accent-color: #006b61; }
    :focus-visible { outline: 3px solid #005fcc; outline-offset: 4px; }
    footer { padding: 24px; border-top: 1px solid #dce2d9; }
  </style>
</head>
<body>
  <main>
    <div id="stage">
      <span class="ttt-logo ttt-logo--animated" role="img" aria-label="Tap to Trade">
        <span class="ttt-logo__row" aria-hidden="true">
          <span class="ttt-logo__mark"><img src="curved-arrow.svg" alt="" width="100" height="100"></span>
          <span class="ttt-logo__window"><span class="ttt-logo__words">To <span class="ttt-logo__trade">Trade</span></span></span>
        </span>
      </span>
    </div>
    <div class="controls">
      <button type="button" id="replay">Replay animation</button>
      <label><input type="checkbox" id="still"> Keep logo still</label>
    </div>
  </main>
  <footer>
    <p class="ttt-credit"><a href="https://thenounproject.com/icon/curved-arrow-6891830/" target="_blank" rel="noopener noreferrer">curved arrow</a> by dh park from <a href="https://thenounproject.com/browse/icons/term/curved-arrow/" target="_blank" rel="noopener noreferrer">Noun Project</a> (<a href="https://creativecommons.org/licenses/by/3.0/" target="_blank" rel="noopener noreferrer">CC BY 3.0</a>). Recoloured and animated; credit moved to this footer.</p>
  </footer>
  <!-- External file: the site's Content-Security-Policy (script-src 'self') blocks inline scripts. -->
  <script src="preview.js"></script>
</body>
</html>
